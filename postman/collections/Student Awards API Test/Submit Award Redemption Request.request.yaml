$kind: http-request
url: http://localhost:5000/app/awards
method: GET
body:
  type: formdata
  content:
    - type: text
      key: activity_description
      value: Helping Event
      disabled: false
    - type: text
      key: hours
      value: "5"
      disabled: false
    - type: text
      key: log_date
      value: 2026-11-09
      disabled: false
    - type: text
      key: notes
      value: None
      disabled: false
scripts:
  - type: afterResponse
    code: pm.test("Status is 303", () => pm.response.to.have.status(303));
    language: text/javascript
order: 4000
